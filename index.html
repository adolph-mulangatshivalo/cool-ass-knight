<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Immersive Landing Experience</title>
  <meta name="description" content="A premium landing page with interactive parallax background.">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
</head>

<body>
  <!-- Loading Screen -->
  <div id="loadingScreen" class="loading-screen">
    <div class="loader-content">
      <h2 class="loader-title">Initializing Experience</h2>
      <div class="progress-container">
        <div id="progressBar" class="progress-bar"></div>
      </div>
      <p id="progressText">0%</p>
    </div>
  </div>

  <!-- Interactive Canvas -->
  <canvas id="sequenceCanvas"></canvas>

  <!-- Visual Polish Overlays -->
  <div class="noise-overlay"></div>
  <div class="vignette-overlay"></div>

  <!-- Content -->
  <div class="right-content">
    <h1 class="right-headline">Move mouse to the left or right.</h1>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="main.js"></script>
</body>

</html>
